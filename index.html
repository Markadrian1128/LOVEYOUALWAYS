<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>I Love You Always</title>
    <meta
      name="description"
      content="A private animated love message with our photo."
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23200d16'/%3E%3Cpath d='M32 50S12 38 12 24c0-7 5-12 12-12 4 0 7 2 8 5 1-3 4-5 8-5 7 0 12 5 12 12 0 14-20 26-20 26z' fill='%23ff7aa8'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #150810;
        --rose: #ff7aa8;
        --rose-soft: #ffd1df;
        --gold: #ffe2a9;
        --ink: #fff7fb;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        overflow-x: hidden;
        background:
          radial-gradient(circle at 18% 12%, rgba(255, 122, 168, 0.28), transparent 28rem),
          radial-gradient(circle at 88% 14%, rgba(255, 226, 169, 0.18), transparent 24rem),
          linear-gradient(145deg, #120710 0%, #271120 46%, #140812 100%);
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      .stage {
        position: relative;
        display: grid;
        min-height: 100svh;
        width: min(100%, 1040px);
        place-items: center;
        padding: clamp(18px, 4vw, 48px);
        isolation: isolate;
      }

      .stage::before {
        position: fixed;
        inset: 0;
        z-index: -3;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
        background-size: 54px 54px;
        content: "";
        mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.7), transparent 80%);
      }

      .photo-wrap {
        position: relative;
        width: min(92vw, 520px);
        aspect-ratio: 3 / 4;
        border: 1px solid rgba(255, 255, 255, 0.28);
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.08);
        box-shadow:
          0 32px 90px rgba(0, 0, 0, 0.45),
          0 0 0 10px rgba(255, 255, 255, 0.04);
        overflow: hidden;
        transform: translateY(18px) scale(0.96);
        animation: photoReveal 1.15s cubic-bezier(0.2, 0.85, 0.2, 1) forwards;
      }

      .photo-wrap::after {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(to top, rgba(13, 5, 10, 0.82) 0%, transparent 44%),
          linear-gradient(120deg, transparent 12%, rgba(255, 255, 255, 0.24) 22%, transparent 34%);
        background-size: 100% 100%, 220% 100%;
        content: "";
        animation: shine 5s ease-in-out 1.2s infinite;
        pointer-events: none;
      }

      .photo-wrap img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        filter: saturate(1.07) contrast(1.02);
        transform: scale(1.035);
        animation: softZoom 9s ease-in-out infinite alternate;
      }

      .message {
        position: absolute;
        right: clamp(24px, 7vw, 64px);
        bottom: clamp(34px, 9vw, 76px);
        left: clamp(24px, 7vw, 64px);
        display: grid;
        gap: 12px;
        justify-items: center;
        text-align: center;
        pointer-events: none;
      }

      .message span {
        display: inline-block;
        color: var(--rose-soft);
        font-size: clamp(0.86rem, 2.4vw, 1rem);
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        opacity: 0;
        transform: translateY(12px);
        animation: riseIn 0.8s ease 1.05s forwards;
      }

      h1 {
        max-width: 12ch;
        margin: 0;
        color: #fff;
        font-size: clamp(2.65rem, 12vw, 6.4rem);
        font-weight: 900;
        line-height: 0.86;
        text-shadow:
          0 0 18px rgba(255, 122, 168, 0.66),
          0 12px 36px rgba(0, 0, 0, 0.5);
        transform: translateY(18px) scale(0.98);
        opacity: 0;
        animation: lovePop 1s cubic-bezier(0.18, 1.05, 0.28, 1) 1.35s forwards;
      }

      .pulse {
        position: absolute;
        inset: 10%;
        z-index: -1;
        border: 2px solid rgba(255, 122, 168, 0.28);
        border-radius: 34px;
        opacity: 0;
        animation: pulseFrame 3.4s ease-out 1.5s infinite;
      }

      .heart {
        position: fixed;
        bottom: -8vh;
        width: var(--size);
        height: var(--size);
        background: rgba(255, 122, 168, 0.82);
        transform: rotate(45deg);
        animation: floatUp var(--duration) linear var(--delay) infinite;
        filter: drop-shadow(0 0 18px rgba(255, 122, 168, 0.42));
        opacity: 0;
        z-index: -2;
      }

      .heart::before,
      .heart::after {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 999px;
        background: inherit;
        content: "";
      }

      .heart::before {
        left: -50%;
      }

      .heart::after {
        top: -50%;
      }

      .heart:nth-child(1) {
        left: 7%;
        --size: 18px;
        --duration: 8s;
        --delay: 0.2s;
      }

      .heart:nth-child(2) {
        left: 18%;
        --size: 11px;
        --duration: 10s;
        --delay: 2.8s;
      }

      .heart:nth-child(3) {
        left: 78%;
        --size: 16px;
        --duration: 9s;
        --delay: 1.1s;
      }

      .heart:nth-child(4) {
        left: 90%;
        --size: 12px;
        --duration: 11s;
        --delay: 3.4s;
      }

      .heart:nth-child(5) {
        left: 50%;
        --size: 10px;
        --duration: 12s;
        --delay: 5s;
      }

      @keyframes photoReveal {
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes softZoom {
        to {
          transform: scale(1.09) translate3d(0, -1%, 0);
        }
      }

      @keyframes shine {
        0%,
        54% {
          background-position: 0 0, 130% 0;
        }

        82%,
        100% {
          background-position: 0 0, -70% 0;
        }
      }

      @keyframes riseIn {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes lovePop {
        72% {
          opacity: 1;
          transform: translateY(0) scale(1.035);
        }

        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes pulseFrame {
        0% {
          opacity: 0.7;
          transform: scale(0.94);
        }

        100% {
          opacity: 0;
          transform: scale(1.18);
        }
      }

      @keyframes floatUp {
        0% {
          opacity: 0;
          transform: translate3d(0, 0, 0) rotate(45deg) scale(0.8);
        }

        14%,
        82% {
          opacity: 0.72;
        }

        100% {
          opacity: 0;
          transform: translate3d(28px, -115vh, 0) rotate(45deg) scale(1.2);
        }
      }

      @media (max-width: 520px) {
        .stage {
          align-content: center;
          padding: 16px;
        }

        .photo-wrap {
          width: min(94vw, 430px);
          border-radius: 22px;
        }

        .message {
          right: 18px;
          bottom: 28px;
          left: 18px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="stage" aria-label="I love you always">
      <i class="heart" aria-hidden="true"></i>
      <i class="heart" aria-hidden="true"></i>
      <i class="heart" aria-hidden="true"></i>
      <i class="heart" aria-hidden="true"></i>
      <i class="heart" aria-hidden="true"></i>

      <section class="photo-wrap">
        <img src="photo.png" alt="Our photo together" />
        <div class="pulse" aria-hidden="true"></div>
        <div class="message">
          <span>For you</span>
          <h1>I LOVE YOU ALWAYS</h1>
        </div>
      </section>
    </main>
  </body>
</html>
